<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAPER</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <div class="logo">SAPER</div>
            <div class="owner">👑 Owner</div>
        </header>

        <main>
            <section class="welcome">
                <h1>Welcome to SAPER</h1>
                <p>Your private communication space.</p>
            </section>

            <section class="cards">

                <button class="card" onclick="openFeature('Chat')">
                    <span>💬</span>
                    <h2>Chat</h2>
                    <p>Send messages and talk with users.</p>
                </button>

                <button class="card" onclick="openFeature('Audio Call')">
                    <span>📞</span>
                    <h2>Audio Call</h2>
                    <p>Make voice calls.</p>
                </button>

                <button class="card" onclick="openFeature('Video Call')">
                    <span>🎥</span>
                    <h2>Video Call</h2>
                    <p>Make video calls.</p>
                </button>

                <button class="card" onclick="openFeature('File Locker')">
                    <span>🔐</span>
                    <h2>File Locker</h2>
                    <p>Keep your files private.</p>
                </button>

                <button class="card" onclick="openFeature('Users')">
                    <span>👥</span>
                    <h2>Users</h2>
                    <p>Manage your SAPER users.</p>
                </button>

                <button class="card" onclick="openFeature('Settings')">
                    <span>⚙️</span>
                    <h2>Settings</h2>
                    <p>Manage your account.</p>
                </button>

            </section>
        </main>

        <footer>
            <p>© 2026 SAPER</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
                      </html>
